# Getting started
# See https://snapcraft.io/docs/getting-started
# Snapcraft references
# See https://snapcraft.io/docs/snapcraft-yaml-reference

name: sdk-rt-template
title: SDK-RT Template
version: 3.0.0
grade: stable
summary: Tempalte for RT cpp
description: |
  Starting point for RT App
base: bare
confinement: strict

architectures:
  - build-on: [amd64, arm64]
    build-for: [amd64]
  - build-on: [amd64, arm64]
    build-for: [arm64]

parts:
  bundle:
    source: ./generated/bundle
    plugin: dump
    organize:
     '*' : bundle/${SNAPCRAFT_PROJECT_NAME}/
  
slots:
  automation-bundle:
    interface: content
    content: automation-bundle-v3
    source:
      read:
        - $SNAP/bundle/${SNAPCRAFT_PROJECT_NAME}